<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Buddy Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="app">
    <div class="grid-horizon" aria-hidden="true"></div>
    <header class="app-header">
      <h1 class="app-title" data-text="STUDY BUDDY">STUDY BUDDY</h1>
      <div id="score-display" class="score-display" aria-live="polite">✓ 0  ✗ 0  Total: 0</div>
    </header>

    <main id="chat-log" class="chat-log" aria-live="polite">
      <div class="message agent">
        <div class="bubble">
          Ask me to quiz you! Try: <em>"Quiz me on hard bugs for 3 questions and keep score."</em><br>
          Topics: js syntax, bugs, debugs, python, git, sql — or say "mixed" for all of them. Tiers: easy, medium, hard.<br>
          Flip the switch below for multiple choice.
        </div>
      </div>
    </main>

    <div class="mode-bar">
      <label class="mc-switch">
        <input type="checkbox" id="mc-toggle">
        <span class="mc-track"><span class="mc-thumb"></span></span>
        <span class="mc-label">MULTIPLE CHOICE</span>
      </label>
    </div>

    <form id="input-row" class="input-row">
      <input
        id="message-input"
        type="text"
        autocomplete="off"
        placeholder="TYPE YOUR MESSAGE..."
        aria-label="Message"
      >
      <button id="send-button" type="submit">SEND</button>
    </form>
  </div>

  <script>
    // Same-origin ("") when Flask serves this page directly (local dev);
    // the deployed Render API when served from Netlify (production), since
    // Netlify only hosts the static frontend, not the Python backend.
    var isLocalDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    window.API_BASE = isLocalDev ? "" : "https://study-buddy-agent-api.onrender.com";
  </script>
  <script src="/app.js" defer></script>
</body>
</html>
